[project]
name = "watchagent-langchain"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-google-genai",
    "langchain-tavily",
    "python-dotenv",
]

[project.scripts]
watchagent = "watchagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watchagent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
