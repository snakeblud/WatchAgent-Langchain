name: WatchAgent Check

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Every workflow that writes watches.db shares this group so runs queue instead
# of racing on the binary file.
concurrency:
  group: watchagent-db
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --locked

      - name: Run watchlist price check
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run watchagent check --notify

      # Runs even if a watch failed or the job timed out: the checks that
      # finished already wrote their prices and alert state.
      - name: Commit updated price history
        if: always()
        run: |
          git config user.name "watchagent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add watches.db
          git diff --staged --quiet || git commit -m "Update watch price history [skip ci]"
          git pull --rebase || { echo "::error::watches.db conflicts with a newer commit; resolve it and re-run"; exit 1; }
          git push
